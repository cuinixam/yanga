feature_model:
  description: Greeting features
  file: KConfig
  pipeline:
    - step: KConfigEdit
      module: yanga_core.steps.kconfig_edit

components:
  - name: main
    path: src
    sources:
      - main.c
  - name: greeter
    path: src/greeter
    sources:
      - greeter.c
    docs_sources:
      - greeter.md
    testing:
      sources:
        - greeter_test.cc
      mocking:
        strict: false

variants:
  - name: EnglishVariant
    description: Say hello in English.
    components:
      - main
      - greeter
  - name: GermanVariant
    description: Say hello in German.
    components:
      - main
      - greeter
    feature_selection:
      file: "config_de.txt"
